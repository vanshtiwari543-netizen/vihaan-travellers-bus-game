<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vihaan Travellers - 3D Bus Simulator</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #050515; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Realistic Cockpit Overlay UI (Matching your reference image) */
        #cockpit-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Top Header Banner */
        .top-banner {
            width: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 80%, transparent 100%);
            display: flex; justify-content: space-between; align-items: flex-start; padding: 15px 25px;
        }
        .brand-title {
            font-size: 28px; font-weight: 900; color: #f3f4f6; letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 15px rgba(255,255,255,0.4);
            border-bottom: 3px solid gold; padding-bottom: 2px;
        }
        .hud-stats {
            background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 15px; border-radius: 8px; color: gold; font-weight: bold; font-size: 16px;
        }

        /* Bottom Controls & Dashboard HUD */
        .bottom-hud {
            width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding: 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
        }
        .steering-wheel-ui {
            width: 180px; height: 180px; border: 8px solid #222; border-radius: 50%;
            background: rgba(30,30,30,0.5); display: flex; align-items: center; justify-content: center;
            pointer-events: auto; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            touch-action: none;
        }
        .steering-inner {
            width: 50px; height: 50px; background: #111; border-radius: 50%; border: 3px solid gold;
            display: flex; align-items: center; justify-content: center; color: gold; font-size: 10px; font-weight: bold;
        }
        .pedals-group {
            display: flex; gap: 15px; pointer-events: auto;
        }
        .pedal {
            width: 75px; height: 140px; border-radius: 10px; border: 3px solid white;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;
            color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.8); cursor: pointer; touch-action: manipulation;
        }
        #brake-pedal { background: linear-gradient(135deg, #991b1b, #7f1d1d); }
        #race-pedal { background: linear-gradient(135deg, #166534, #14532d); height: 160px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UI Overlay matching the requested luxury cockpit view -->
    <div id="cockpit-overlay">
        <div class="top-banner">
            <div class="brand-title">VIHAAN TRAVELLERS</div>
            <div class="hud-stats" id="speed-display">SPEED: 0 KM/H</div>
        </div>

        <div class="bottom-hud">
            <!-- Interactive Steering Wheel on Left -->
            <div class="steering-wheel-ui" id="steering-area">
                <div class="steering-inner">HORN</div>
            </div>

            <!-- Pedals on Right -->
            <div class="pedals-group">
                <div class="pedal" id="brake-pedal">BRAKE / REV</div>
                <div class="pedal" id="race-pedal">RACE</div>
            </div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x040410);
        scene.fog = new THREE.FogExp2(0x040410, 0.015);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.2, -4);
        camera.lookAt(0, 1.5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x334155, 1.2);
        scene.add(ambientLight);

        const streetLight = new THREE.DirectionalLight(0x38bdf8, 1.5);
        streetLight.position.set(20, 40, 20);
        scene.add(streetLight);

        // Road Environment (South Delhi Highway Simulation)
        const roadGeo = new THREE.PlaneGeometry(16, 1200);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        scene.add(road);

        // Center lane markings
        for (let i = -500; i < 500; i += 20) {
            const lineGeo = new THREE.BoxGeometry(0.4, 0.05, 5);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.position.set(0, 0.02, i);
            scene.add(line);
        }

        // Environment Buildings (Delhi Skyscrapers / Monuments style)
        for (let i = -500; i < 500; i += 40) {
            const bMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });
            
            // Left Building
            const bLeft = new THREE.Mesh(new THREE.BoxGeometry(12, 45, 15), bMat);
            bLeft.position.set(-18, 22.5, i);
            scene.add(bLeft);

            // Right Building
            const bRight = new THREE.Mesh(new THREE.BoxGeometry(12, 35, 15), bMat);
            bRight.position.set(18, 17.5, i + 20);
            scene.add(bRight);
        }

        // Monkey Toy Simulation hanging in center view
        const monkeyGroup = new THREE.Group();
        const stringMat = new THREE.LineBasicMaterial({ color: 0xffffff });
        const points = [new THREE.Vector3(0, 3, 2), new THREE.Vector3(0, 1.8, 2)];
        const stringGeo = new THREE.BufferGeometry().setFromPoints(points);
        const hangString = new THREE.Line(stringGeo, stringMat);
        monkeyGroup.add(hangString);

        const monkeyHead = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshStandardMaterial({ color: 0x92400e }));
        monkeyHead.position.set(0, 1.6, 2);
        monkeyGroup.add(monkeyHead);
        scene.add(monkeyGroup);

        // Game Variables
        let speed = 0;
        let maxSpeed = 0.8;
        let accelerating = false;
        let braking = false;
        let steeringVal = 0;

        // Control Bindings
        const racePedal = document.getElementById('race-pedal');
        const brakePedal = document.getElementById('brake-pedal');

        racePedal.addEventListener('touchstart', () => { accelerating = true; });
        racePedal.addEventListener('touchend', () => { accelerating = false; });
        racePedal.addEventListener('mousedown', () => { accelerating = true; });
        racePedal.addEventListener('mouseup', () => { accelerating = false; });

        brakePedal.addEventListener('touchstart', () => { braking = true; });
        brakePedal.addEventListener('touchend', () => { braking = false; });
        brakePedal.addEventListener('mousedown', () => { braking = true; });
        brakePedal.addEventListener('mouseup', () => { braking = false; });

        // Animation Loop
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta();

            if (accelerating) {
                if (speed < maxSpeed) speed += 0.015;
            } else if (braking) {
                if (speed > 0) speed -= 0.03;
                else speed = 0;
            } else {
                if (speed > 0) speed -= 0.008;
            }

            road.position.z -= speed;
            if (road.position.z < -600) road.position.z = 0;

            // Monkey swing effect based on speed and movement
            monkeyGroup.rotation.z = Math.sin(Date.now() * 0.008) * 0.15 + (steeringVal * 0.2);

            document.getElementById('speed-display').innerText = `SPEED: ${Math.round(speed * 180)} KM/H`;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
